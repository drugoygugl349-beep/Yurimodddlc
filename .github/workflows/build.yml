name: Build DDLC Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v3
      - name: Install Ren'Py SDK
        run: |
          wget https://www.renpy.org/dl/7.1.2/renpy-7.1.2-sdk.tar.bz2
          tar -xjf renpy-7.1.2-sdk.tar.bz2
      - name: Build Mod
        run: |
          cd renpy-7.1.2-sdk
          ./renpy.sh launcher distribute /home/runner/work/Yurimodddlc/Yurimodddlc --destination /home/runner/work/Yurimodddlc/Yurimodddlc/target --package pc
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: Yurimodddlc-Build
          path: target/*.zip
