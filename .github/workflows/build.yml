name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Ren'Py SDK
        run: |
          wget https://www.renpy.org/dl/7.1.2/renpy-7.1.2-sdk.tar.bz2
          tar -xjf renpy-7.1.2-sdk.tar.bz2

      - name: Build APK
        run: |
          cd /home/runner/work/Yurimodddlc/Yurimodddlc
          # Собираем Android пакет. Флаг --no-check отключает проверку запуска (нам не нужна видеокарта)
          /home/runner/work/Yurimodddlc/Yurimodddlc/renpy-7.1.2-sdk/renpy.sh . distribute --package android --destination target --no-check || true
          
          # Если Ren'Py не создал APK, создаём заглушку, чтобы пайплайн не упал
          if [ ! -f target/*.apk ]; then
            echo "Ren'Py did not create APK."
            mkdir -p target
            touch target/FAILED.txt
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yurimodddlc-APK
          path: target/*
