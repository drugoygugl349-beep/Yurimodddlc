name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Ren'Py SDK
        run: |
          wget https://www.renpy.org/dl/7.1.2/renpy-7.1.2-sdk.tar.bz2
          tar -xjf renpy-7.1.2-sdk.tar.bz2

      - name: Build APK
        run: |
          # Запускаем LAUNCHER, а не renpy.py напрямую
          cd /home/runner/work/Yurimodddlc/Yurimodddlc/renpy-7.1.2-sdk
          ./renpy.sh launcher distribute /home/runner/work/Yurimodddlc/Yurimodddlc --package android --destination /home/runner/work/Yurimodddlc/Yurimodddlc/target
          
          # Если APK не создался, пишем FAILED
          if [ ! -f /home/runner/work/Yurimodddlc/Yurimodddlc/target/*.apk ]; then
            echo "Ren'Py did not create APK." > /home/runner/work/Yurimodddlc/Yurimodddlc/target/FAILED.txt
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yurimodddlc-APK
          path: target/*
