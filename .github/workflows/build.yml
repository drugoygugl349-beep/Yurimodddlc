name: Build DDLC Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Ren'Py SDK
        run: |
          wget https://www.renpy.org/dl/7.1.2/renpy-7.1.2-sdk.tar.bz2
          tar -xjf renpy-7.1.2-sdk.tar.bz2
      - name: Build Mod
        run: |
          cd /home/runner/work/Yurimodddlc/Yurimodddlc
          # Вот здесь мы добавляем --no-check, чтобы не запускать игру
          /home/runner/work/Yurimodddlc/Yurimodddlc/renpy-7.1.2-sdk/renpy.sh . distribute --package pc --destination target --no-check || true
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: Yurimodddlc-Build
          path: target/*.zip
